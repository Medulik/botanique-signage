<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotel conference navigation</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,sans-serif;background:#f1f3ef;color:#263d32}main{height:100%;display:flex;flex-direction:column;padding:3% 5%;gap:2%}header{font-size:clamp(18px,3vw,38px);font-weight:bold;letter-spacing:.1em}#events{flex:1;min-height:0;display:flex;flex-direction:column;gap:2%}.event{flex:1;min-height:0;background:white;border-left:10px solid #60816e;padding:3%;display:grid;grid-template-columns:1fr 22%;align-items:center;gap:2%}.time{font-size:clamp(18px,2.6vw,34px);font-weight:bold}.name{font-size:clamp(24px,4vw,54px);font-weight:bold;margin:2% 0;overflow-wrap:anywhere}.room{font-size:clamp(20px,3vw,42px)}.arrow{font-size:clamp(70px,14vw,180px);text-align:center;color:#52735f}.logos{display:flex;gap:12px;align-items:center;margin-top:3%}.logos img{max-width:40%;max-height:90px;object-fit:contain}</style></head><body><main><header>CONFERENCE &amp; EVENTS</header><section id="events">Načítám program…</section></main><script>const box=document.getElementById('events');const arrows={left:'←',right:'→',up:'↑',down:'↓'};function field(parent,cls,value){const el=document.createElement('div');el.className=cls;el.textContent=value||'';parent.appendChild(el)}async function update(){try{const response=await fetch('events.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const all=await response.json();const now=new Date();const active=all.filter(e=>e.enabled&&(!e.start||!e.end||(new Date(e.start)<=now&&now<new Date(e.end)))).slice(0,2);box.replaceChildren();if(!active.length){box.textContent='Aktuálně nejsou naplánovány žádné akce.';return}for(const e of active){const card=document.createElement('article');card.className='event';const left=document.createElement('div');field(left,'time',(e.from||'')+' – '+(e.to||''));field(left,'name',e.name);field(left,'room',e.room);const logos=document.createElement('div');logos.className='logos';for(const path of (e.logos||[]).slice(0,4)){if(!/^logos\/[a-zA-Z0-9_.-]+$/.test(path))continue;const img=document.createElement('img');img.src=path;img.alt='Logo pořadatele';logos.append(img)}left.append(logos);card.append(left);field(card,'arrow',arrows[e.direction]||'↑');box.append(card)}}catch(e){if(!box.querySelector('.event'))box.textContent='Nelze načíst program: '+e.message}}update();setInterval(update,30000);</script></body></html>
